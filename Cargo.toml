[package]
name = "duckdb_irt"
version = "0.1.0"
edition = "2021"
description = "DuckDB extension: 2PL Item Response Theory (MML/EM) — item params + ability EAP"
license = "MIT"
repository = "https://github.com/alitrack/duckdb_irt"

[lib]
name = "irt_ext"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
strip = true

[dependencies]
quack-rs = "0.14"
libduckdb-sys = "1.10504"
libm = "0.2"
